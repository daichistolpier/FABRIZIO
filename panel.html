<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="panel.js" type="module"></script>
    <link rel="stylesheet" href="panel.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="title-wrapper">
        <img src="img/logo.png" class="logo" />
        <!-- <h1>FABRIZIO</h1> -->
    </div>

    <details class="panel-section">
        <summary>
            <img src="img/star.svg" alt="" class="summary-icon">
            <span>Favorites</span>
        </summary>
        <div class="favorites">
        </div>
    </details>

    <details open class="panel-section">
        <summary>
            <img src="img/lens.svg" alt="" class="summary-icon">
            <span>Global search</span>

        </summary>
        <div class="global--search">
            <!-- <h3>Global Search</h3> -->
            <form class="global--ws">
                <h3>Workspace</h3>
                <div class="search-input-wrapper">
                    <img src="img/lens.svg" alt="" class="search-input-icon">
                    <input type="text" placeholder="workspace..." class="input--global--ws">
                </div>
                <div class="global--found-ws"></div>
                <div class="global--clicked-ws"></div>
                <!-- <button class="btn--global--wsForm">
                🔎
            </button> -->
                <!-- <datalist id="global-workspace-list"></datalist> -->
            </form>
            <form class="global--item item--hidden">
                <!-- <form class="global--item" style="display: none;"> -->
                <h3>Item</h3>
                <div class="search-input-wrapper">
                    <img src="img/lens.svg" alt="" class="search-input-icon">
                    <input type="text" placeholder="item..." class="input--global--item">
                </div>
                <div class="item-type-filters"></div>
                <div class="global--found-item"></div>
                <div class="global--clicked-item"></div>
            </form>
        </div>
    </details>

    <details class="panel-section" open="">
        <summary>
            <img src="img/utilities.svg" alt="" class="summary-icon">
            <span>Utilites</span>
        </summary>
        <details class="panel-getConnectionInfo" open="">
            <summary>Get Connection Info</summary>
            <div class="connection-info-div">
                <form class="getConnectionInfo">
                    <!-- <h3>Get Connection Info</h2> -->
                    <input type="text" placeholder="connection id..." class="input--getConnectionInfo">

                </form>
            </div>
        </details>
        <details class="panel-json-beautifier" open="">
            <summary>Json Beautifier</summary>
            <div class="json-beautifier-div">
                <form class="jsonBeautifier">
                    <textarea placeholder="Paste your JSON..." class="input--jsonbeautifier" rows="4"></textarea>

                    <button type="submit" class="button--beautify-json">
                        Beautify JSON
                    </button>
                </form>
            </div>
        </details>
    </details>
</body>

</html>
